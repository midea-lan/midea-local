# Run via prek: https://github.com/j178/prek
# See https://pre-commit.com/hooks.html for more hooks (prek uses the same config format)
exclude: "CHANGELOG.md|.copier-answers.yml|^lua/|^tests/lua_conformance/(GENERATED_.*[.]md|conformance_baseline[.]json)$"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        args: ["--tab-width", "2"]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-aiofiles
          - pycryptodome
          - platformdirs
  - repo: https://github.com/PyCQA/pylint
    rev: v4.0.7
    hooks:
      - id: pylint
        name: pylint
        types: [python]
        additional_dependencies:
          - aiofiles
          - pycryptodome
          - platformdirs
          - typing_extensions
          - aiohttp
          - colorlog
          - defusedxml
          - ifaddr
          - setuptools
        args: [
            "-rn", # Only display messages
            "-sn", # Don't display the score
            "--rcfile=pylintrc",
            "--ignore-paths=tests",
          ]
