[project]
name = "midea-local"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Control your Midea M-Smart appliances via local area network"
authors = [
{ name = "rokam", email = "lucas@mindello.com.br" },
{ name = "chemelli74", email = "simone.chemelli@gmail.com" }
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
"aiofiles",
"aiohttp",
"anyio",
"colorlog",
"defusedxml",
"ifaddr",
"pycryptodome",
"platformdirs",
"typing_extensions>=4.5.0",
]

[project.urls]
"Homepage" = "https://github.com/midea-lan/midea-local"

[project.scripts]
midealocal = "midealocal.cli:main"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "setuptools",
    "types-aiofiles",
]

[tool.setuptools.dynamic]
version = { attr = "midealocal.version.__version__" }

[tool.setuptools.packages.find]
include = ["midealocal*"]

[tool.pytest.ini_options]
addopts = "-v -Wdefault --cov=midealocal --cov-report=term-missing"
testpaths = ["tests"]

[tool.codespell]
ignore-regex = '\bmapp\.appsmb\.com\b'

[tool.coverage.run]
branch = true
source = ["midealocal"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.mypy]
files = ["midealocal", "tests"]
python_version = "3.12"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
