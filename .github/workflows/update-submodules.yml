# This workflow uses the release-please GitHub Action to automate releases.
# it only works on the main branch: PR mereged to main will trigger the release-please action
# and PR will be created to update the version in the manifest file and create a release with the new version.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: update-submodules

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Update Submodules
        id: submodules
        uses: sgoudham/update-git-submodules@v2.1.3

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: update all submodules"
          branch: "chore/update-lua"
          title: "chore: update lua"
          body: ${{ steps.submodules.outputs.prBody }}
