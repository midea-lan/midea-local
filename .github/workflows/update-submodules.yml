# This workflow checks for submodule updates when changes are pushed to the main branch.
# If any submodules have changed, it opens a pull request with the updates.
on:
  push:
    branches:
      - main

name: update-submodules

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: midea-lan
          repositories: midea-local

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Update Submodules
        id: submodules
        uses: sgoudham/update-git-submodules@v2.1.3

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: update all submodules"
          branch: "chore/update-submodules"
          title: "chore: update submodules"
          body: ${{ steps.submodules.outputs.prBody }}
