# This workflow runs on pull requests to the main branch and on published releases.
# It checks commit messages, builds the Python package, runs tests, and deploys to PyPI for releases.
name: PR and Python checks

on:
  # Trigger the workflow on push to main
  push:
    branches: ["main"]
  # Trigger the workflow on pull requests to main
  pull_request:
    branches: ["main"]
  # Trigger the workflow on published releases
  release:
    types: [published]
  # Allow manual triggering for deployment recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    name: PR Commit Messages Check
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: commitlint.config.mjs

  build:
    name: Python Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: ["windows-latest", "ubuntu-latest", "macos-latest"]
    env:
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -r requirements-all.txt prek build
        shell: bash
      - name: Activate virtualenv
        # This repo has no pyproject.toml, so expose the .venv to later steps by
        # putting it on PATH. On Windows the venv layout is .venv/Scripts and
        # GITHUB_PATH needs a native path (cygpath), otherwise system hooks like
        # pylint can't find their executable.
        run: |
          if [ -d .venv/bin ]; then
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          else
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
            cygpath -w "$PWD/.venv" | sed 's/^/VIRTUAL_ENV=/' >> "$GITHUB_ENV"
          fi
        shell: bash
      - name: Cache prek environments
        if: github.event_name != 'release'
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run prek
        if: github.event_name != 'release'
        run: prek run --show-diff-on-failure --color=always --all-files
        shell: bash
      - name: Build midea-lan
        run: python -m build
        shell: bash
      - name: Test with pytest
        run: |
          python -m pytest --rootdir . --cov=midealan --cov-report html --cov-report xml --junitxml=reports/junit/junit.xml ./tests/
          mv htmlcov reports/coverage
        shell: bash
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # ── PyPI deployment ──
  # Trigger: this job runs on the "release: published" event OR manual workflow_dispatch.
  # The release:published event is emitted by create-release.yml, which creates the
  # GitHub Release with a PAT so the event cascades to this workflow (GITHUB_TOKEN-created
  # releases do NOT trigger other workflows). If a release is published but this job did
  # not run, check that create-release.yml used MIDEA_GITHUB_PAT and not GITHUB_TOKEN.
  #
  # Manual trigger: use workflow_dispatch (Actions → PR and Python checks → Run workflow)
  # as a recovery option when the automatic release:published trigger fails. For security,
  # manual runs are restricted to release tags (refs/tags/v*) via the condition below.
  # The pypi environment should be configured with required reviewers for additional protection.
  #
  # Auth: the upload uses PyPI Trusted Publisher (OIDC) - note `permissions:
  # id-token: write`, the `environment: pypi`, and that pypa/gh-action-pypi-publish
  # is called WITHOUT any username/password/api-token. GitHub mints a short-lived
  # OIDC token that PyPI trusts. There is NO PyPI API token and NO PAT involved in
  # the actual upload - do not add one.
  deploy:
    name: Deploy Release to PyPI
    needs: [build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/midea-lan
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Build package
        run: |
          uv venv --python 3.14
          uv pip install build
          .venv/bin/python3 -m build
        shell: bash
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
