# Coverage uploads for PRs from forks can't use secrets.CODECOV_TOKEN directly:
# GitHub withholds repo secrets from `pull_request` runs triggered by a fork, and
# Codecov's tokenless fallback for this repo isn't accepting uploads. This workflow
# runs via `workflow_run`, which always executes in the base repo's context (so it
# has real secret access) after the PR workflow finishes, and re-uploads the
# coverage report that workflow already produced as an artifact.
#
# Nothing here executes code from the triggering run/PR - it only downloads a data
# artifact and checks out the PR's commit for path context, so it's safe to run
# with secrets even when the trigger was a fork PR.
name: Upload Coverage to Codecov

on:
  workflow_run:
    workflows: ["PR and Python checks"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  upload:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR number for this commit
        id: pr
        run: |
          number=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.pr.outputs.number }}
